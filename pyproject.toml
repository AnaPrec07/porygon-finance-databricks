[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porygon"
version = "0.1.0"
description = "Porygon Finance Pilot - Databricks data platform"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "pyyaml>=6"]

[project.scripts]
purge_landed_files = "porygon.jobs.purge_landed_files:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
exclude = ["src/porygon/pipelines/"]

[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
