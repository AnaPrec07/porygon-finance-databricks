name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC / workload identity federation: no personal tokens
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

  validate:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_STAGING }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t staging

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    environment: staging
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_STAGING }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t staging

  integration-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_STAGING }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      # Placeholder until slice 2 adds synthetic fixtures: runs the ingest job end to end.
      - run: databricks bundle run ingest_job -t staging

  deploy-prod:
    runs-on: ubuntu-latest
    needs: integration-staging
    environment: prod # configure required reviewers on this GitHub environment (the gate)
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
